name: Workflow for CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # We declare this output so the deploy job can read it later
    outputs:
      short_sha: ${{ steps.get_hash.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Commit Hash
        id: get_hash
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | cut -c 1-7)
          echo "Commit Hash: $COMMIT_HASH"
          # This sets the output variable for the entire job block
          echo "short_sha=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log into Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: tomipter/devops-flask-app:${{ steps.get_hash.outputs.short_sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_PEM_KEY }}
          script: |
            cd ~/DevOps_Indutrialization

            # Map your 7-character hash output into a local .env file on the VM
            echo "IMAGE_TAG=${{ needs.build.outputs.short_sha }}" > .env

            echo "Deploying image version: ${{ needs.build.outputs.short_sha }}"

            # Removed the invalid '-d' flag from pull
            docker compose pull
            docker compose up -d
