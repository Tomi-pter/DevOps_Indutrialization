version: "3.9"

services:
  flask-app-1:
    image: tomipter/devops-flask-app:${APP1_IMAGE_TAG:-latest}
    ports:
      - "8001:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "secret"
      DB_NAME: "mysql"
      INSTANCE_NAME: "flask-app-1"
      APP_VERSION: "${APP1_IMAGE_TAG:-latest}"
    depends_on:
      - mysql

  flask-app-2:
    image: tomipter/devops-flask-app:${APP2_IMAGE_TAG:-latest}
    ports:
      - "8002:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "secret"
      DB_NAME: "mysql"
      INSTANCE_NAME: "flask-app-2"
      APP_VERSION: "${APP2_IMAGE_TAG:-latest}"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
