version: "3.9"

services:
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "secret"
      DB_NAME: "mysql"
    volumes:
      - .:/app
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mysql
    ports:
      - "3206:3206"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
